name: Python application

on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master
  # Nightly run on master so retired runner images or Python builds vanish
  # loudly overnight instead of being discovered by the next pull request.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-publish:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations: every entry must carry python-version, or the
        # job name loses it. The old macOS entry had none and ran as "macOS /".
        include:
          - { os: Ubuntu,  image: ubuntu-24.04, python-version: "3.8"  }
          - { os: Ubuntu,  image: ubuntu-24.04, python-version: "3.11" }
          - { os: Windows, image: windows-2022, python-version: "3.8"  }
          - { os: Windows, image: windows-2022, python-version: "3.11" }
          # Python 3.8 has no macOS arm64 build, so macOS runs 3.11.
          - { os: macOS,   image: macos-15,     python-version: "3.11" }
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get full Python version
      id: full-python-version
      run: echo version=$(python -c "import sys; print('-'.join(str(v) for v in sys.version_info))") >> $GITHUB_OUTPUT

    - name: Update PATH
      if: ${{ matrix.os != 'Windows' }}
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Update Path for Windows
      if: ${{ matrix.os == 'Windows' }}
      run: echo "$APPDATA\Python\Scripts" >> $GITHUB_PATH

    - name: Enable long paths for git on Windows
      if: ${{ matrix.os == 'Windows' }}
      # Enable handling long path names (+260 char) on the Windows platform
      # https://docs.microsoft.com/en-us/windows/win32/fileio/naming-a-file#maximum-path-length-limitation
      run: git config --system core.longpaths true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Run tests with coverage
      run: |
        make cov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: openatx/uiautomator2
